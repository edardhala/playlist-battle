name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [rooms, battle]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Local_Dev_Only_1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Local_Dev_Only_1 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      TEST_DATABASE_URL: mssql://sa:Local_Dev_Only_1@localhost:1433/master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=. --cov-config=.coveragerc --cov-fail-under=70

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.34.1 openapi-spec-validator==0.7.2
      - run: check-jsonschema --schemafile system.schema.json system.yaml
      - run: openapi-spec-validator services/rooms/openapi.yaml services/battle/openapi.yaml

  images:
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [rooms, battle]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/playlist-battle-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      RG: rg-ehala-ieu2024
      PREFIX: ehala-ieu2024
      ENV_NAME: ehala-ieu2024-env
      STORAGE: ehalaieu2024ui
      SQL_HOST: ehala-ieu2024-sql.database.windows.net
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Send container logs to Log Analytics
        run: |
          if ! az monitor log-analytics workspace show -g "$RG" -n "$PREFIX-logs" -o none 2>/dev/null; then
            az monitor log-analytics workspace create -g "$RG" -n "$PREFIX-logs" --sku PerGB2018 --retention-time 30 -o none
          fi
          workspace=$(az monitor log-analytics workspace show -g "$RG" -n "$PREFIX-logs" --query customerId -o tsv)
          current=$(az containerapp env show -g "$RG" -n "$ENV_NAME" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          if [ "$current" != "$workspace" ]; then
            key=$(az monitor log-analytics workspace get-shared-keys -g "$RG" -n "$PREFIX-logs" --query primarySharedKey -o tsv)
            echo "::add-mask::$key"
            az containerapp env update -g "$RG" -n "$ENV_NAME" --logs-destination log-analytics \
              --logs-workspace-id "$workspace" --logs-workspace-key "$key" -o none
          fi
      - name: Find the UI address
        run: |
          origin=$(az storage account show -g "$RG" -n "$STORAGE" --query primaryEndpoints.web -o tsv)
          echo "UI_ORIGIN=${origin%/}" >> "$GITHUB_ENV"
      - name: Deploy rooms
        run: |
          fqdn=$(infra/deploy-service.sh rooms "$REGISTRY/playlist-battle-rooms:$GITHUB_SHA" \
            "${{ secrets.ROOMS_DB_PASSWORD }}" "CORS_ORIGIN=$UI_ORIGIN")
          echo "ROOMS_URL=https://$fqdn" >> "$GITHUB_ENV"
      - name: Deploy battle
        run: |
          fqdn=$(infra/deploy-service.sh battle "$REGISTRY/playlist-battle-battle:$GITHUB_SHA" \
            "${{ secrets.BATTLE_DB_PASSWORD }}" "CORS_ORIGIN=$UI_ORIGIN" "ROOMS_URL=$ROOMS_URL")
          echo "BATTLE_URL=https://$fqdn" >> "$GITHUB_ENV"
      - name: Upload the UI
        run: |
          mkdir -p build
          cp -R ui/. build/
          cat > build/config.js <<CONFIG
          window.CONFIG = {
            ROOMS_URL: "$ROOMS_URL",
            BATTLE_URL: "$BATTLE_URL",
          };
          CONFIG
          az storage blob upload-batch --account-name "$STORAGE" --auth-mode key \
            --destination '$web' --source build --overwrite \
            --content-cache-control "no-cache" --only-show-errors -o none
      - name: Check health
        run: |
          for url in "$ROOMS_URL" "$BATTLE_URL"; do
            for attempt in $(seq 1 20); do
              if curl -fsS --max-time 30 "$url/health"; then
                echo
                continue 2
              fi
              echo "$url not healthy yet (attempt $attempt), waiting"
              sleep 10
            done
            echo "$url did not become healthy"
            exit 1
          done
      - name: Show startup logs
        if: always()
        run: |
          for service in rooms battle; do
            az containerapp logs show -g "$RG" -n "$PREFIX-$service" --tail 40 --format text || true
          done
