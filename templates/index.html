{% extends "base.html" %}
{% block content %}
  <section class="hero">
    <h1>Let the <span>votes</span> pick the music</h1>
    <p>Start a room, invite your friends with a code, and let the votes decide what plays next.</p>
  </section>

  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

  <div class="grid">
    <section class="card">
      <div class="card-icon" aria-hidden="true">🎧</div>
      <h2>Start a room</h2>
      <form method="post" action="{{ url_for('rooms.create') }}">
        <label for="room_name">Room name</label>
        <input id="room_name" name="room_name" placeholder="Friday road trip" required>
        <label for="host_name">Your name</label>
        <input id="host_name" name="your_name" required>
        <button type="submit">Start the battle</button>
      </form>
    </section>

    <section class="card">
      <div class="card-icon" aria-hidden="true">🎟️</div>
      <h2>Join a room</h2>
      <form method="post" action="{{ url_for('rooms.join') }}">
        <label for="code">Room code</label>
        <input id="code" name="code" value="{{ code }}" placeholder="ABC123" autocomplete="off" required>
        <label for="guest_name">Your name</label>
        <input id="guest_name" name="your_name" required>
        <button type="submit">Join the battle</button>
      </form>
    </section>
  </div>
{% endblock %}
