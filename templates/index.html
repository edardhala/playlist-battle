{% extends "base.html" %}
{% block content %}
  <h1>Playlist Battle</h1>
  <p>Create a room, add songs with your friends, and vote for what plays next.</p>

  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

  <h2>Start a room</h2>
  <form method="post" action="{{ url_for('rooms.create') }}">
    <label for="room_name">Room name</label>
    <input id="room_name" name="room_name" required>
    <label for="host_name">Your name</label>
    <input id="host_name" name="your_name" required>
    <button type="submit">Create room</button>
  </form>

  <h2>Join a room</h2>
  <form method="post" action="{{ url_for('rooms.join') }}">
    <label for="code">Room code</label>
    <input id="code" name="code" required>
    <label for="guest_name">Your name</label>
    <input id="guest_name" name="your_name" required>
    <button type="submit">Join</button>
  </form>
{% endblock %}
