<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playlist Battle</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="site-header" href="index.html">
    <img class="logo" src="logo.svg" alt="">
    Playlist Battle
  </a>
  <main>
    <section class="hero">
      <h1>Let the <span>votes</span> pick the music</h1>
      <p>Start a room, invite your friends with a code, and let the votes decide what plays next.</p>
    </section>

    <p class="error" role="alert" id="error" hidden></p>

    <div class="grid">
      <section class="card">
        <div class="card-icon" aria-hidden="true">🎧</div>
        <h2>Start a room</h2>
        <form id="create-form">
          <label for="room_name">Room name</label>
          <input id="room_name" name="room_name" placeholder="Friday road trip" required>
          <label for="host_name">Your name</label>
          <input id="host_name" name="your_name" required>
          <button type="submit">Start the battle</button>
        </form>
      </section>

      <section class="card">
        <div class="card-icon" aria-hidden="true">🎟️</div>
        <h2>Join a room</h2>
        <form id="join-form">
          <label for="code">Room code</label>
          <input id="code" name="code" placeholder="ABC123" autocomplete="off" required>
          <label for="guest_name">Your name</label>
          <input id="guest_name" name="your_name" required>
          <button type="submit">Join the battle</button>
        </form>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="index.js"></script>
</body>
</html>
